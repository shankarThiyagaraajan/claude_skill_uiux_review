<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="uiux-review: a UI/UX lead review of your running web app, TUI or CLI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="132" font-size="72" font-weight="800" letter-spacing="-1.5">uiux-review</text>
    <text x="66" y="182" font-size="26" fill-opacity=".92">A UI/UX lead that runs your app, captures every screen</text>
    <text x="66" y="216" font-size="26" fill-opacity=".92">and hands back prioritized, evidence-backed fixes.</text>
    <g font-size="18" font-weight="700">
      <rect x="64" y="246" width="96" height="36" rx="18" fill="#ffffff" fill-opacity=".18"/>
      <text x="112" y="270" text-anchor="middle">Web</text>
      <rect x="172" y="246" width="96" height="36" rx="18" fill="#ffffff" fill-opacity=".18"/>
      <text x="220" y="270" text-anchor="middle">TUI</text>
      <rect x="280" y="246" width="96" height="36" rx="18" fill="#ffffff" fill-opacity=".18"/>
      <text x="328" y="270" text-anchor="middle">CLI</text>
    </g>
  </g>
  <!-- window + magnifier glyph -->
  <g transform="translate(860 18)" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="20" width="300" height="210" rx="22" stroke-width="12"/>
    <line x1="6" y1="66" x2="294" y2="66" stroke-width="10"/>
    <circle cx="32" cy="44" r="7" fill="#ffffff" stroke="none"/>
    <circle cx="58" cy="44" r="7" fill="#ffffff" stroke="none"/>
    <circle cx="84" cy="44" r="7" fill="#ffffff" stroke="none"/>
    <line x1="36" y1="104" x2="160" y2="104" stroke-width="16"/>
    <line x1="36" y1="140" x2="122" y2="140" stroke-width="16" stroke-opacity=".7"/>
    <line x1="36" y1="176" x2="138" y2="176" stroke-width="16" stroke-opacity=".7"/>
    <circle cx="262" cy="190" r="78" fill="#4f6bea" stroke-width="14"/>
    <polyline points="226,192 252,218 298,166" stroke-width="16"/>
    <line x1="318" y1="246" x2="356" y2="284" stroke-width="26"/>
  </g>
</svg>
